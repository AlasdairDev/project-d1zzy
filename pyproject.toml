[project]
name = "project-d1zzy-market"
version = "0.1.0"
description = "Privacy-respecting P2P marketplace on Tor with abuse controls"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "fastapi-users[sqlalchemy]>=14,<15",
    "stripe>=12",
    "pynacl>=1.5.0",
    "arq==0.28.0",
    "redis[hiredis]>=5,<6",
    "aiosmtplib>=3",
    "structlog>=24",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25,<1.0",
    "testcontainers[postgres,redis]>=4.9",
    "httpx-ws>=0.7",
    "ruff>=0.8",
    "fonttools[woff]>=4.50",
]
# Security assurance tooling: `just security` runs these, CI runs them on every push.
security = [
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra -q"
markers = [
    "monero: real Monero regtest daemon + wallet-rpc containers (~40 s; SKIP_MONERO_TESTS=1 skips)",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
    "ignore:The wait_for_logs function:DeprecationWarning",
    "ignore:The @wait_container_is_ready decorator:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.bandit]
# Bandit runs with `-r app`; list exclusions for completeness when invoked differently.
exclude_dirs = [".venv", "tests", "app/static", "alembic"]
# B101: asserts are used for internal invariants in non-security paths.
skips = ["B101"]
