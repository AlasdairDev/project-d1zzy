{# expects `score` (float or int, may be None) and optional `count` #}
{% if score %}
<div class="rating-stars" title="{{ '%.1f' % score }} out of 5">
  {% set full = (score + 0.5) | int %}
  {% for i in range(1, 6) %}
    <span class="material-symbols-rounded {% if i <= full %}filled{% elif i == full + 1 and score % 1 >= 0.25 %}half{% else %}empty{% endif %}" aria-hidden="true">star</span>
  {% endfor %}
</div>
<span class="text-xs text-muted">{{ "%.1f" % score }}{% if count is defined %} ({{ count }}){% endif %}</span>
{% else %}<span class="text-xs text-muted">No ratings yet</span>{% endif %}
