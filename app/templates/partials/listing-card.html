{# expects `v` (ListingView) #}
<a href="/listings/{{ v.id }}" class="listing-card" aria-label="{{ v.plain.title }} by @{{ v.seller.handle }}">
  <div class="listing-card-media">
    {% if v.plain.images %}
      <img src="/media/{{ v.id }}/0" alt="" loading="lazy" decoding="async">
    {% else %}
      <div class="placeholder aspect-square">
        <span class="material-symbols-rounded" aria-hidden="true">image</span>
      </div>
    {% endif %}
  </div>
  <div class="listing-card-content">
    <p class="listing-card-title">{{ v.plain.title }}</p>
    <p class="listing-card-price">{{ v.plain.price_cents | money(v.plain.currency) }}</p>
    <div class="listing-card-meta">
      <span><span class="material-symbols-rounded icon-xs" aria-hidden="true">person</span> @{{ v.seller.handle }}</span>
      <span><span class="material-symbols-rounded icon-xs" aria-hidden="true">tag</span> {{ v.plain.condition.replace("_", " ") }}</span>
      <span><span class="material-symbols-rounded icon-xs" aria-hidden="true">schedule</span> {{ v.listing.created_at | ago }}</span>
    </div>
  </div>
</a>
